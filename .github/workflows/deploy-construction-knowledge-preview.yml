name: Validate construction-knowledge historical branch

on:
  push:
    branches:
      - construction-knowledge-kernel-demo-v0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project-controls and fail-closed knowledge data
        run: |
          python - <<'PY'
          import json, pathlib
          k=json.loads(pathlib.Path("construction-knowledge.json").read_text())
          p=json.loads(pathlib.Path("project-controls-demo.json").read_text())
          works={x["key"]:x for x in k["works"]}
          acts={x["activity_id"]:x for x in p["activities"]}
          assert works["waterproofing"]["work_id"]=="WRK-000023"
          assert works["soak-pit"]["work_id"] is None
          assert works["soak-pit"]["identity_status"]=="IDENTITY_PENDING"
          assert acts["A090"]["work_id"]=="WRK-000023"
          assert p["meta"]["authority"]=="SYNTHETIC_DEMO_ONLY"
          assert pathlib.Path("schemas/construction-work.schema.json").exists()
          print("Historical construction-knowledge validation PASS")
          PY
      - name: Confirm non-production boundary
        run: |
          echo "VALIDATION_ONLY=PASS"
          echo "This branch cannot deploy to the github-pages environment."
