name: Release · Skyforge v1.6.1 (one-time)
on:
  push:
    branches:
      - kernel-v0.2-open-source-engines
    paths:
      - .github/workflows/release-skyforge-v161-once.yml

permissions:
  contents: write

jobs:
  tag-and-release:
    if: github.repository == 'FabinGurung/JP_Scheduling_Work_and_Resources_Management'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_COMMIT: 0c0d97e68d8c1c8b9bde320b419cedbdbfaf5e40
      VALIDATED_RUN: '39210683401'
      RELEASE_TAG: v1.6.1-visual.1
    steps:
      - name: Verify immutable milestone and successful Pages run
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/kernel-v0.2-open-source-engines"
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TARGET_COMMIT}" --jq .sha)
          test "$sha" = "$TARGET_COMMIT"
          result=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VALIDATED_RUN}" --jq .conclusion)
          tested_sha=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VALIDATED_RUN}" --jq .head_sha)
          test "$result" = "success"
          test "$tested_sha" = "$TARGET_COMMIT"
          echo "Immutable target and Pages deployment verified."
      - name: Create annotated tag and published prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing duplicate publication."
            exit 0
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag already exists. Refusing to retarget."
            exit 1
          fi
          tag_object=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f "tag=${RELEASE_TAG}" \
            -f "message=Skyforge v1.6.1 visual milestone - tested slow zigzag Pip; scheduling kernel and private evidence unchanged" \
            -f "object=${TARGET_COMMIT}" \
            -f "type=commit" --jq .sha)
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${RELEASE_TAG}" -f "sha=${tag_object}" >/dev/null
          cat > "${RUNNER_TEMP}/skyforge-release-notes.md" <<'NOTES'
          ## Skyforge v1.6.1 — slow zigzag Pip (visual milestone)

          **Pinned commit:** `0c0d97e68d8c1c8b9bde320b419cedbdbfaf5e40`
          **Verified deployment:** [GitHub Actions #39210683401](https://github.com/FabinGurung/JP_Scheduling_Work_and_Resources_Management/actions/runs/39210683401)
          **Website:** https://fabingurung.github.io/JP_Scheduling_Work_and_Resources_Management/

          ### Included
          - Slower, nearly continuous screen-spanning serpentine crawl, around **16 CSS pixels per second**.
          - Travel segments follow distance-based linear CSS timing without the previous long idle gap.
          - Gentler **1.7-second** hover escape, while retaining the **tenth-encounter 9-second petting pause**.
          - Existing mobile/touch, keyboard, user pause control and reduced-motion support retained.
          - v1.6 white theme, mobile constellation improvements, researcher handbook and CPM/EVM learning tools preserved.

          ### Verified gates
          - **181/181 tests passed.**
          - **3,888 calendar oracle cases passed.**
          - Deterministic machine/WBS/pilot/progress/visual builds and readback passed.
          - Narayani **45 WBS activities, 49 links, 405 MCQ questions, 7 milestones** unchanged.
          - **14 allowlisted public pages** validated; private engineering source data excluded.
          - Pages deployment reported success.

          ### Engineering boundaries
          This is a **visual prerelease/milestone**, not a claim of Primavera P6/MS Project feature parity, authenticated live source sync, an approved project baseline, or site engineering authorization. The scheduling kernel, project evidence and approvals are unchanged. Independent physical-browser animation QA remains unverified.

          **Rollback parent:** prior Skyforge v1.6 UI checkpoint `30c0e5956d09aa0c297bc1d2a366c9ab5f614fc9`.
          NOTES
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "Skyforge v1.6.1 · Slow Zigzag Pip" \
            --notes-file "${RUNNER_TEMP}/skyforge-release-notes.md"
      - name: Read back tag object and release against tested commit
        shell: bash
        run: |
          set -euo pipefail
          tagsha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha)
          target=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tagsha}" --jq .object.sha)
          test "$target" = "$TARGET_COMMIT"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,url --jq '{tagName,isDraft,isPrerelease,url}'
