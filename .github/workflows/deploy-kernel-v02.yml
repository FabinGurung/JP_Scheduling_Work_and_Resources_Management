name: Site · Validate and Deploy
on:
  push:
    branches:
      - kernel-v0.2-open-source-engines
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "jp-scheduling-production-pages"
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kernel-v0.2-open-source-engines
      - name: Enforce canonical Pages source
        run: test "$GITHUB_REF_NAME" = "kernel-v0.2-open-source-engines"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run all safety, UI and kernel tests
        run: npm test
      - name: Verify calendar scheduling oracle
        run: npm run verify:calendar
      - name: Generate deterministic public synthetic schedule
        run: npm run machine:build
      - name: Verify regenerated output byte-for-byte
        run: npm run machine:verify
      - name: Execute Drive-pinned synthetic 45-activity WBS on native CPM kernel
        run: npm run wbs:build
      - name: Recalculate WBS independently and verify all output digests
        run: npm run wbs:verify
      - name: Build source-pinned Narayani pilot WBS overlay
        run: npm run pilot:build
      - name: Verify source-pinned Narayani mapping byte-for-byte
        run: npm run pilot:verify
      - name: Build governed Narayani field evidence projection
        run: npm run progress:build
      - name: Verify field evidence projection exact readback and privacy guard
        run: npm run progress:verify
      - name: Authenticate Google WIF only when Narayani sync is enabled
        if: ${{ vars.NARAYANI_SYNC_ENABLED == 'true' }}
        id: narayani-google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.NARAYANI_WIF_PROVIDER }}
          service_account: ${{ secrets.NARAYANI_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets.readonly
          create_credentials_file: false
      - name: Reconcile latest authorized Narayani Drive evidence
        if: ${{ vars.NARAYANI_SYNC_ENABLED == 'true' }}
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.narayani-google-auth.outputs.access_token }}
          NARAYANI_DRIVE_SPREADSHEET_ID: ${{ secrets.NARAYANI_DRIVE_SHEET_ID }}
          NARAYANI_AUTHENTICATED_SYNC: 'true'
        run: node scripts/run-narayani-live-sync.mjs
      - name: Generate canonical visual project JSON for constellation and calendar
        run: npm run visual:build
      - name: Verify deterministic 45-node model and 405 MCQ checklists
        run: npm run visual:verify
      - name: Build arbitrary-project public-synthetic four-view models
        run: npm run generic:build
      - name: Verify generic project models byte-for-byte
        run: npm run generic:verify
      - name: Build public-safe allowlisted site only
        env:
          NARAYANI_AUTHENTICATED_SYNC: ${{ vars.NARAYANI_SYNC_ENABLED }}
        run: npm run site:build
      - name: Verify output never exposes fixture or private records
        run: |
          test ! -e dist/machine/requests/demo-foundation.json
          test ! -e dist/examples/kernel-network.json
          test ! -e dist/README.md
          test -s dist/machine/demo-foundation/plan.json
          test -s dist/machine/demo-foundation/manifest.json
          test -s dist/machine/wbs-sample/plan.json
          test -s dist/machine/wbs-sample/gantt.svg
          test -s dist/machine/wbs-sample/manifest.json
          test -s dist/projects/narayani/index.html
          test -s dist/projects/narayani/map.json
          test -s dist/projects/narayani/progress.json
          test -s dist/projects/narayani/visual.html
          test -s dist/projects/narayani/project-model.json
          test -s dist/projects/narayani/visual-manifest.json
          test -s dist/projects/generic/index.html
          test -s dist/projects/generic/community-clinic.json
          test -s dist/projects/generic/pedestrian-bridge.json
          test -s dist/projects/generic/manifest.json
          test ! -e dist/machine/generic-projects/community-clinic.json
          test ! -e dist/machine/generic-projects/pedestrian-bridge.json
          test ! -e dist/machine/project-mappings/narayani-checklist-config-v0.1.json
          test -s dist/projects/narayani/progress-manifest.json
          test ! -e dist/machine/project-mappings/narayani-progress-public-v0.1.json
          test ! -e dist/generated/private/narayani/audit.json
          test -s dist/projects/narayani/manifest.json
          test ! -e dist/machine/project-mappings/narayani-v0.1.json
          test ! -e dist/machine/source-snapshots/wbs_schedule_sample/schedule_seed.json
      - name: Validate upstream registry and fail-closed project data
        run: |
          python - <<'PY'
          import json, pathlib
          upstream=json.loads(pathlib.Path("UPSTREAM_SOURCES.json").read_text())
          knowledge=json.loads(pathlib.Path("construction-knowledge.json").read_text())
          demo=json.loads(pathlib.Path("project-controls-demo.json").read_text())
          assert len(upstream["sources"]) == 5
          works={x["key"]:x for x in knowledge["works"]}
          acts={x["activity_id"]:x for x in demo["activities"]}
          assert works["shuttering"]["work_id"]=="WRK-000002"
          assert works["shuttering"]["checklist_template_id"]=="CK-BLD-STRUCT-FORM-001"
          assert works["waterproofing"]["work_id"]=="WRK-000023"
          assert works["soak-pit"]["work_id"] is None
          assert works["soak-pit"]["identity_status"]=="IDENTITY_PENDING"
          assert acts["A090"]["work_id"]=="WRK-000023"
          assert pathlib.Path("knowledge/index.html").exists()
          assert pathlib.Path("knowledge/task.html").exists()
          assert pathlib.Path("knowledge/shuttering.html").exists()
          assert pathlib.Path("roadmap.html").exists()
          print("Governance/data validation PASS")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"
      - id: deployment
        uses: actions/deploy-pages@v4
